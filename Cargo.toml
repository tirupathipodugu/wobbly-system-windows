[package]
name = "wobbly-system"
version = "0.1.0"
edition = "2021"
description = "System-wide Compiz-style wobbly windows for Windows"
authors = ["Wobbly System"]

[[bin]]
name = "wobbly-system"
path = "src/main.rs"

[dependencies]
# Microsoft's official Rust bindings for the Windows API.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
]}
windows-core = "0.58"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Build only on Windows targets.
[package.metadata.winres]
LegalCopyright = "Wobbly System"
FileDescription = "System-wide wobbly windows"
